services:
  python-api:
    build: ../services/python-api
    ports:
      - "8000:8000"

  node-api:
    build: ../services/node-api
    ports:
      - "8001:8001"

  todo-api:
    build: ../services/todo-api
    ports:
      - "8002:8002"
    volumes:
      - ../services/todo-api/data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/todo.db
      - JWT_SECRET_KEY=todo-api-secret-key-for-development
